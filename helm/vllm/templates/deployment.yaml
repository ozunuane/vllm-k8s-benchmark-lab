apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-vllm
  labels:
    app: vllm
    app.kubernetes.io/name: vllm
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  # When autoscaling is on, the HPA owns .spec.replicas — rendering it
  # here causes a server-side apply conflict with kube-controller-manager
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: vllm
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: vllm
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.metrics.port }}"
        prometheus.io/path: "{{ .Values.metrics.path }}"
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.model.s3Path }}
      initContainers:
        # Weights from S3 (same region, ~hundreds of MB/s) instead of HF
        # over the internet — the biggest lever on pod boot / scale-out time
        - name: fetch-weights
          image: amazon/aws-cli:2.22.0
          args: ["s3", "sync", "{{ .Values.model.s3Path }}", "{{ .Values.model.mountPath }}", "--no-progress"]
          volumeMounts:
            - name: model-weights
              mountPath: {{ .Values.model.mountPath }}
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
      {{- end }}
      containers:
        - name: vllm
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--model"
            {{- if .Values.model.s3Path }}
            - "{{ .Values.model.mountPath }}"
            - "--served-model-name"
            - "{{ .Values.model.name }}"
            {{- else }}
            - "{{ .Values.model.name }}"
            {{- end }}
            - "--max-model-len"
            - "{{ .Values.serving.maxModelLen }}"
            - "--gpu-memory-utilization"
            - "{{ .Values.serving.gpuMemoryUtilization }}"
            - "--max-num-seqs"
            - "{{ .Values.serving.maxNumSeqs }}"
            - "--tensor-parallel-size"
            - "{{ .Values.serving.tensorParallelSize }}"
            - "--dtype"
            - "{{ .Values.serving.dtype }}"
            {{- range .Values.serving.extraArgs }}
            - "{{ . }}"
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # Boot = download weights + torch.compile + CUDA graphs (~4-6 min)
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 40 # up to 10 min to boot
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            {{- if .Values.model.s3Path }}
            - name: model-weights
              mountPath: {{ .Values.model.mountPath }}
            {{- end }}
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
        {{- if .Values.model.s3Path }}
        - name: model-weights
          emptyDir:
            sizeLimit: 20Gi # node has 100Gi gp3; weights ~5.3Gi (AWQ)
        {{- end }}
