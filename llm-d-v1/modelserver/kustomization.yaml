apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - disaggregatedset.yaml

# Pinned images (upstream guide defaults to :main/nightly — gotcha-in-waiting).
# vLLM pin matches the upstream v1.0.0 release component; sidecar is the
# v1.0.0 release tag (verified on ghcr).
images:
  - name: REPLACE_MODEL_SERVER_IMAGE
    newName: docker.io/vllm/vllm-openai
    newTag: v0.31.0
  - name: REPLACE_ROUTING_SIDECAR_IMAGE
    newName: ghcr.io/llm-d/llm-d-router-disagg-sidecar
    newTag: v1.0.0
