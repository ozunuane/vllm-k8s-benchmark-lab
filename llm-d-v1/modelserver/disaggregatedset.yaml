# llm-d v1.0 P/D model servers as a DisaggregatedSet (LWS operator,
# enableDisaggregatedSet=true). Adapted from the upstream guide
# (llm-d/llm-d@v1.0.0 guides/pd-disaggregation/modelserver/gpu/vllm/base)
# for this lab's capacity:
#   upstream: gpt-oss-120b, prefill TP=1 + decode TP=4 on p5en/H200 + EFA
#   here:     Qwen2.5-7B-AWQ, prefill TP=1 + decode TP=1 on g6/g5.xlarge, UCX/TCP
# The pod label llm-d.ai/pool=qwen-pd is the InferencePool selector contract —
# it must match router.modelServers.matchLabels in the router app's values.
apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  name: llm-d-pd
  labels:
    llm-d.ai/inference-serving: "true"
    llm-d.ai/pool: qwen-pd
    llm-d.ai/accelerator-variant: gpu
    llm-d.ai/accelerator-vendor: nvidia
    llm-d.ai/engine-type: vllm
    llm-d.ai/model: qwen2-5-7b-instruct-awq
spec:
  # One 1-prefill + 1-decode set = 2 GPU nodes = the full 8 G-vCPU quota.
  # Raising slices requires a quota increase first (gotcha 11).
  slices: 1

  roles:
    - name: prefill
      spec:
        replicas: 1 # per slice
        groupIdentity: Hash
        rolloutStrategy:
          rollingUpdateConfiguration:
            # Capacity-constrained: no surge headroom under the 8-vCPU quota.
            maxSurge: 0
            maxUnavailable: 1
        leaderWorkerTemplate:
          size: 1 # single-host: each group is one pod
          workerTemplate:
            metadata:
              labels:
                llm-d.ai/inference-serving: "true"
                llm-d.ai/pool: qwen-pd
                llm-d.ai/accelerator-variant: gpu
                llm-d.ai/accelerator-vendor: nvidia
                llm-d.ai/engine-type: vllm
                llm-d.ai/model: qwen2-5-7b-instruct-awq
                llm-d.ai/role: prefill
              annotations:
                prometheus.io/scrape: "true"
                prometheus.io/port: "8000"
                prometheus.io/path: "/metrics"
            spec:
              serviceAccountName: llm-d-pd
              nodeSelector:
                inference-role: prefill
              tolerations:
                - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
                - { key: inference-role, value: prefill, effect: NoSchedule }
              containers:
                - name: modelserver
                  image: REPLACE_MODEL_SERVER_IMAGE
                  command: ["vllm", "serve"]
                  args:
                    - "Qwen/Qwen2.5-7B-Instruct-AWQ"
                    - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
                    - "--tensor-parallel-size=1"
                    - "--max-model-len=4096"
                    - "--gpu-memory-utilization=0.90"
                    - "--block-size=128"
                    - "--kv-transfer-config"
                    - '{"kv_connector":"NixlConnector","kv_role":"kv_producer","kv_buffer_device":"cuda","kv_connector_extra_config":{"backends":["UCX"]}}'
                    - "--no-disable-hybrid-kv-cache-manager"
                    - "--shutdown-timeout=45"
                  env:
                    - name: HF_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: llm-d-hf-token
                          key: HF_TOKEN
                    - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    # vLLM keep-alive must be >= the routing sidecar's 90s idle
                    # conn timeout or connection reuse gets TCP RSTs (upstream note).
                    - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
                      value: "120"
                  ports:
                    - { name: modelserver, containerPort: 8000, protocol: TCP }
                    - { name: nixl, containerPort: 5600, protocol: TCP }
                  resources:
                    # g6/g5.xlarge fit: allocatable < capacity (gotcha 5)
                    limits:
                      cpu: "3"
                      memory: 12Gi
                      nvidia.com/gpu: "1"
                    requests:
                      cpu: "3"
                      memory: 12Gi
                      nvidia.com/gpu: "1"
                  startupProbe:
                    httpGet: { path: /v1/models, port: modelserver }
                    initialDelaySeconds: 15
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 120
                  livenessProbe:
                    httpGet: { path: /health, port: modelserver }
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 3
                  readinessProbe:
                    httpGet: { path: /v1/models, port: modelserver }
                    periodSeconds: 5
                    timeoutSeconds: 2
                    failureThreshold: 3
                  volumeMounts:
                    - { mountPath: /dev/shm, name: shm }
                    - { mountPath: /.cache, name: torch-compile-cache }
                    - { mountPath: /.config, name: vllm-config }
                    - { mountPath: /.triton, name: triton-cache }
              volumes:
                - name: shm
                  emptyDir: { medium: Memory, sizeLimit: 8Gi }
                - name: torch-compile-cache
                  emptyDir: {}
                - name: vllm-config
                  emptyDir: {}
                - name: triton-cache
                  emptyDir: {}

    - name: decode
      spec:
        replicas: 1 # per slice
        groupIdentity: Hash
        rolloutStrategy:
          rollingUpdateConfiguration:
            # Upstream surges decode; we can't — no spare GPU under quota.
            maxSurge: 0
            maxUnavailable: 1
        leaderWorkerTemplate:
          size: 1 # single-host: each group is one pod
          workerTemplate:
            metadata:
              labels:
                llm-d.ai/inference-serving: "true"
                llm-d.ai/pool: qwen-pd
                llm-d.ai/accelerator-variant: gpu
                llm-d.ai/accelerator-vendor: nvidia
                llm-d.ai/engine-type: vllm
                llm-d.ai/model: qwen2-5-7b-instruct-awq
                llm-d.ai/role: decode
              annotations:
                prometheus.io/scrape: "true"
                prometheus.io/port: "8200"
                prometheus.io/path: "/metrics"
            spec:
              serviceAccountName: llm-d-pd
              nodeSelector:
                inference-role: decode
              tolerations:
                - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
                - { key: inference-role, value: decode, effect: NoSchedule }
              initContainers:
                # Routing proxy sidecar: listens on 8000, fronts vLLM on 8200,
                # pulls KV from prefill via nixlv2. The InferencePool targets
                # port 8000 on both roles; this sidecar is what makes that
                # uniform for decode.
                - name: routing-proxy
                  image: REPLACE_ROUTING_SIDECAR_IMAGE
                  args:
                    - --port=8000
                    - --kv-connector=nixlv2
                    - --zap-log-level=1
                    - --secure-serving=false
                  ports:
                    - { name: sidecar, containerPort: 8000, protocol: TCP }
                  resources:
                    requests: { cpu: 250m, memory: 256Mi }
                    limits: { memory: 512Mi }
                  restartPolicy: Always
                  securityContext:
                    allowPrivilegeEscalation: false
                    runAsNonRoot: true
              containers:
                - name: modelserver
                  image: REPLACE_MODEL_SERVER_IMAGE
                  command: ["vllm", "serve"]
                  args:
                    - "Qwen/Qwen2.5-7B-Instruct-AWQ"
                    - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
                    - "--tensor-parallel-size=1"
                    - "--max-model-len=4096"
                    - "--gpu-memory-utilization=0.90"
                    - "--block-size=128"
                    - "--kv-transfer-config"
                    - '{"kv_connector":"NixlConnector","kv_role":"kv_consumer","kv_buffer_device":"cuda","kv_connector_extra_config":{"backends":["UCX"]}}'
                    - "--no-disable-hybrid-kv-cache-manager"
                    - "--port=8200"
                    - "--shutdown-timeout=45"
                  env:
                    - name: HF_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: llm-d-hf-token
                          key: HF_TOKEN
                    - name: VLLM_NIXL_SIDE_CHANNEL_HOST
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                    - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
                      value: "120"
                  ports:
                    - { name: modelserver, containerPort: 8200, protocol: TCP }
                    - { name: nixl, containerPort: 5600, protocol: TCP }
                  resources:
                    limits:
                      cpu: "3"
                      memory: 12Gi
                      nvidia.com/gpu: "1"
                    requests:
                      cpu: "3"
                      memory: 12Gi
                      nvidia.com/gpu: "1"
                  startupProbe:
                    httpGet: { path: /v1/models, port: modelserver }
                    initialDelaySeconds: 15
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 120
                  livenessProbe:
                    httpGet: { path: /health, port: modelserver }
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 3
                  readinessProbe:
                    httpGet: { path: /v1/models, port: modelserver }
                    periodSeconds: 5
                    timeoutSeconds: 2
                    failureThreshold: 3
                  volumeMounts:
                    - { mountPath: /dev/shm, name: shm }
                    - { mountPath: /.cache, name: torch-compile-cache }
                    - { mountPath: /.config, name: vllm-config }
                    - { mountPath: /.triton, name: triton-cache }
              volumes:
                - name: shm
                  emptyDir: { medium: Memory, sizeLimit: 8Gi }
                - name: torch-compile-cache
                  emptyDir: {}
                - name: vllm-config
                  emptyDir: {}
                - name: triton-cache
                  emptyDir: {}
