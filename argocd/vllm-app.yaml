apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vllm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ozunuane/vllm-k8s-benchmark-lab.git
    targetRevision: main
    path: helm/vllm
    helm:
      # Must match the existing helm-CLI release name so Argo adopts
      # the live resources (vllm-vllm) instead of duplicating them
      releaseName: vllm
      valuesObject:
        model:
          s3Path: s3://vllm-bench-models-595893120359/qwen2.5-7b-instruct-awq
        autoscaling:
          enabled: true
          minReplicas: 1
          maxReplicas: 2 # = EC2 G-vCPU quota (8) / 4 per node
  destination:
    server: https://kubernetes.default.svc
    namespace: inference
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
