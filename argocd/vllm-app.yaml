apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vllm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ozunuane/vllm-k8s-benchmark-lab.git
    targetRevision: main
    path: helm/vllm
    helm:
      # Must match the existing helm-CLI release name so Argo adopts
      # the live resources (vllm-vllm) instead of duplicating them
      releaseName: vllm
      valuesObject:
        model:
          s3Path: s3://vllm-bench-models-595893120359/qwen2.5-7b-instruct-awq
        autoscaling:
          enabled: true
          # Fixed single replica for the combined-vs-disaggregated A/B.
          # Quota 16 fits combined (1 GPU) + llm-d P/D (2 GPUs) concurrently.
          # Park again with min 0; raise max for KEDA scale-out tests.
          minReplicas: 0
          maxReplicas: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: inference
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
