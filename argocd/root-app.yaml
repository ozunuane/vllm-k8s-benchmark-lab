# App-of-apps: Argo manages the Application manifests themselves.
# Without this, editing argocd/*.yaml in git changes nothing (gotcha 19).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ozunuane/vllm-k8s-benchmark-lab.git
    targetRevision: main
    path: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
