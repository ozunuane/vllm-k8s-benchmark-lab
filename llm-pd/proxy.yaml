# P/D routing proxy — the "gateway" of the disaggregated pattern.
# For each request: 1) prefill produces KV (max_tokens=1),
# 2) decode consumes KV and generates. Stdlib-only; lab-grade.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pd-proxy-script
  namespace: inference
data:
  proxy.py: |
    import json, os, http.server, urllib.request, socketserver

    PREFILL = os.environ.get("PREFILL_URL", "http://vllm-prefill:8000")
    DECODE  = os.environ.get("DECODE_URL",  "http://vllm-decode:8000")

    def post(base, path, body, timeout=300):
        req = urllib.request.Request(
            base + path, data=json.dumps(body).encode(),
            headers={"Content-Type": "application/json"}, method="POST")
        with urllib.request.urlopen(req, timeout=timeout) as r:
            return json.loads(r.read())

    class H(http.server.BaseHTTPRequestHandler):
        def log_message(self, *a): pass

        def do_GET(self):
            if self.path == "/health":
                self.send_response(200); self.end_headers(); self.wfile.write(b"ok")
            else:
                self.send_response(404); self.end_headers()

        def do_POST(self):
            body = json.loads(self.rfile.read(int(self.headers["Content-Length"])))
            path = self.path
            try:
                # 1) prefill: KV production only
                pre = dict(body)
                pre["max_tokens"] = 1
                pre["stream"] = False
                pre["kv_transfer_params"] = {
                    "do_remote_decode": True, "do_remote_prefill": False}
                p = post(PREFILL, path, pre)
                # 2) decode: consume remote KV, generate for real
                dec = dict(body)
                dec["stream"] = False
                dec["kv_transfer_params"] = p.get("kv_transfer_params") or {}
                dec["kv_transfer_params"]["do_remote_prefill"] = True
                out = post(DECODE, path, dec)
                data = json.dumps(out).encode()
                self.send_response(200)
            except Exception as e:
                data = json.dumps({"error": str(e)}).encode()
                self.send_response(502)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

    class S(socketserver.ThreadingMixIn, http.server.HTTPServer):
        daemon_threads = True

    print("pd-proxy on :8000 ->", PREFILL, "then", DECODE, flush=True)
    S(("", 8000), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pd-proxy
  namespace: inference
  labels: { app: pd-proxy }
spec:
  replicas: 1
  selector:
    matchLabels: { app: pd-proxy }
  template:
    metadata:
      labels: { app: pd-proxy }
    spec:
      containers:
        - name: proxy
          image: python:3.12-slim
          command: ["python", "/app/proxy.py"]
          env:
            - { name: PREFILL_URL, value: "http://vllm-prefill.inference.svc:8000" }
            - { name: DECODE_URL, value: "http://vllm-decode.inference.svc:8000" }
          ports: [{ containerPort: 8000 }]
          volumeMounts: [{ name: script, mountPath: /app }]
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
      volumes:
        - name: script
          configMap: { name: pd-proxy-script }
---
apiVersion: v1
kind: Service
metadata:
  name: pd-proxy
  namespace: inference
spec:
  type: ClusterIP
  selector: { app: pd-proxy }
  ports:
    - { port: 8000, targetPort: 8000 }
