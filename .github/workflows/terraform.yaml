name: Terraform

on:
  pull_request:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform.yaml"]
  push:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform.yaml"]
  workflow_dispatch: {}

permissions:
  id-token: write # OIDC token for AWS — no stored keys
  contents: read

env:
  TF_DIR: terraform

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug OIDC claims (temporary)
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          PAD=$(( (4 - ${#PAYLOAD} % 4) % 4 )); PAYLOAD="$PAYLOAD$(printf '=%.0s' $(seq 1 $PAD) 2>/dev/null)"
          echo "$PAYLOAD" | base64 -d 2>/dev/null | jq '{iss, aud, sub}'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }} # keeps account id out of the public repo
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0" # matches local; >=1.10 for use_lockfile

      - name: Format check
        run: terraform -chdir=$TF_DIR fmt -check -diff

      - name: Init (S3 backend)
        run: terraform -chdir=$TF_DIR init -input=false

      - name: Validate
        run: terraform -chdir=$TF_DIR validate

      - name: Plan
        id: plan
        # Role is read-only + state access: plan works, apply never can.
        # -lock=false: advisory plan, don't block a human mid-apply.
        # -refresh=false: helm/kubectl providers would need cluster creds to
        #   refresh release state (helm state lives in Secrets — no read-only
        #   EKS policy covers that). CI plans config-vs-state, not live drift.
        run: |
          set -o pipefail
          terraform -chdir=$TF_DIR plan -input=false -no-color -lock=false -refresh=false -out=/dev/null 2>&1 \
            | tee plan.txt
          echo "## Terraform plan" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -40 plan.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # Deploy half of the pipeline. Runs only on main (push or manual dispatch),
  # and the "production" environment requires manual approval in GitHub before
  # the job starts — the apply role's OIDC trust only matches the
  # environment-gated sub, so an un-gated job can't even assume it.
  apply:
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, apply role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Init (S3 backend)
        run: terraform -chdir=$TF_DIR init -input=false

      - name: Apply
        run: |
          set -o pipefail
          terraform -chdir=$TF_DIR apply -input=false -no-color -auto-approve 2>&1 \
            | tee apply.txt
          echo "## Terraform apply" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -40 apply.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
