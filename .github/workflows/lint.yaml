name: Lint

on:
  pull_request:
    branches: [main]

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint vLLM chart
        run: helm lint helm/vllm/

      - name: Render check — both autoscaling modes
        run: |
          helm template vllm helm/vllm/ > /dev/null
          helm template vllm helm/vllm/ --set autoscaling.enabled=true > /dev/null

  # terraform fmt/validate/plan moved to terraform.yaml (OIDC + real S3 backend)
